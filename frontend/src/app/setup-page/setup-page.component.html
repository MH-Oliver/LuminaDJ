<main class="page-container">
  <div class="lumina-ambient-glow"></div>
  <div class="setup-content">
    <h1>setup</h1>
    <p class="subtitle">before starting:</p>
    <div class="connection-list">
      <div class="connection-item">
        <input type="checkbox" [checked]="isSpotifyConnected" disabled class="custom-checkbox">
        <span class="item-text">
          Connect to Spotify
          <a class="highlight-link" (click)="connectSpotify()">here</a>
        </span>
        <span class="tooltip" title="Connect your Spotify account">i</span>
      </div>
      <div class="connection-item">
        <input type="checkbox" [checked]="isCameraConnected" disabled class="custom-checkbox">
        <span class="item-text">
          Connect to Smartphone with Camera
          <a class="highlight-link" (click)="connectCamera()">here</a>
        </span>
        <span class="tooltip" title="Connect your camera">i</span>
      </div>
    </div>
    <button class="btn-primary continue-btn" [disabled]="!isSpotifyConnected || !isCameraConnected" routerLink="/session-setup">
      continue
    </button>
  </div>
</main>
