<main class="page-container">
  <div class="lumina-ambient-glow"></div>
  <header class="header">
    <div class="logo">LuminaDJ</div>
    <div class="spotify-account">
      <span class="spotify-icon"></span>
      <span class="account-name">{{ spotifyUser }}</span>
    </div>
  </header>

  <section class="timeline-section">
    <div class="timeline-header">
      <h2>Select your Timeline</h2>
      <select class="preset-dropdown" (change)="onPresetChange($event)">
        <option value="" disabled selected>Preset wählen</option>
        <!-- Iteriert über die vom Backend geladenen Presets -->
        @for (preset of availablePresets; track preset) {
          <option [value]="preset">{{ preset }}</option>
        }
      </select>

      <div class="length-input-wrapper">
        <label>Timeline Länge:</label>
        <input type="number" class="timeline-input" [value]="totalMinutes" step="5" min="10" (change)="updateTimelineLength($event)">
        <span>min</span>
      </div>
    </div>

    <div class="timeline-widget">
      <div class="timeline-scroll-area">
        <div class="grid-and-legend-wrapper" [style.min-width.px]="totalMinutes * 10">

          <div class="timeline-grid">
            <div class="timeline-tracks">
              <div class="grid-lines" [style.background-size]="gridBackgroundSize"></div>

              <!-- MODERN ANGULAR @for -->
              @for (block of blocks; track block.id) {
                <div class="genre-block"
                     [class.row-top]="block.row === 0"
                     [class.row-bottom]="block.row === 1"
                     [class.delete-warning]="block === draggingBlock && isDraggingOutside"
                     [style.left]="getLeft(block)"
                     [style.width]="getWidth(block)"
                     (mousedown)="onMouseDownMove($event, block)"
                     (click)="openDialog(block)">

                  <span class="genre-title">{{ block.title }}</span>
                  <span class="genre-duration">{{ block.duration }} min</span>

                  <div class="resize-handle" (mousedown)="onMouseDownResize($event, block)"></div>
                  <div class="delete-overlay">drop to delete</div>
                </div>
              }
            </div>
          </div>

          <div class="timeline-legend">
            <div class="ticks-container">
              <!-- MODERN ANGULAR @for -->
              @for (tick of ticks; track tick) {
                <span class="tick-label" [style.left.%]="(tick / totalMinutes) * 100">
                  {{ tick }}
                </span>
              }
            </div>
          </div>

        </div>
      </div>

      <div class="add-genre-wrapper">
        <div class="default-plus">+</div>
        <div class="add-half top-half" (click)="addBlock(0)" title="Add to top row">+</div>
        <div class="add-half bottom-half" (click)="addBlock(1)" title="Add to bottom row">+</div>
      </div>
    </div>
  </section>

  <footer class="footer">
    <button class="btn-primary ready-btn" (click)="onReady()">Ready</button>
  </footer>

  <!-- MODERN ANGULAR @if -->
  @if (selectedBlock) {
    <div class="modal-overlay" (click)="closeDialog()">
      <div class="modal-content" (click)="$event.stopPropagation()">
        <h3>Edit Block</h3>
        <div class="input-group">
          <label>Genre:</label>
          <select class="modal-dropdown" [value]="selectedBlock.title" (change)="updateGenre($event)">
            <!-- MODERN ANGULAR @for -->
            @for (genre of availableGenres; track genre) {
              <option [value]="genre">{{ genre }}</option>
            }
          </select>
        </div>
        <div class="input-group">
          <label>Duration: <span class="highlight">{{ selectedBlock.duration }} min</span></label>
          <input type="range" class="duration-slider" min="5" max="120" step="5"
                 [value]="selectedBlock.duration"
                 (input)="updateDuration($event)">
        </div>
        <div class="modal-actions">
          <button class="btn-danger modal-btn" (click)="deleteSelectedBlock()">Delete</button>
          <button class="btn-primary modal-btn" (click)="closeDialog()">Done</button>
        </div>
      </div>
    </div>
  }

  <!-- MODERN ANGULAR @if -->
  @if (errorMessage) {
    <div class="modal-overlay" (click)="closeError()">
      <div class="modal-content error-modal" (click)="$event.stopPropagation()">
        <h3>Achtung</h3>
        <p>{{ errorMessage }}</p>
        <button class="btn-primary modal-btn error-btn" (click)="closeError()">Verstanden</button>
      </div>
    </div>
  }

</main>
